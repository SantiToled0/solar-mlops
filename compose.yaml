services:
  postgres:
    image: postgres:17
    container_name: solar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10


  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: solar-mlflow
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "5000:5000"

    volumes:
      - mlflow_artifacts:/mlartifacts

    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir "psycopg[binary]"
        mlflow db upgrade "${MLFLOW_BACKEND_STORE_URI}"
        mlflow server \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination /mlartifacts \
          --serve-artifacts \
          --host 0.0.0.0 \
          --port 5000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 30


volumes:
  postgres_data:
  mlflow_artifacts: